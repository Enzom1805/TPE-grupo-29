<svg width="20" height="20" viewBox="0 0 74 74" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Kingly Games Isotype">
  <defs>
    <!-- Filtro Glow simplificado y ajustado para 20x20 -->
    <filter id="kg-logo-glow-small" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7614cc" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9933ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Isotipo compuesto: Circunferencia + Corona -->
  <g filter="url(#kg-logo-glow-small)">
    <!-- Circunferencia (Centrada en el nuevo viewBox de 74x74) -->
    <!-- El centro está en 37, 37 y el radio es de 31.9 (aprox), para que entre el stroke -->
    <circle cx="37" cy="37" r="31.9" stroke="#F8F7FC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Corona (Trasladada para centrarla en el nuevo viewBox) -->
    <!-- Coordenadas originales ajustadas: X - 38, Y - 36 -->
    <path d="M53 48.5139L57 26.1528L43 32.8611L37 26.1528L31 32.8611L17 26.1528L21 48.5139H53Z" 
          stroke="#F8F7FC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
